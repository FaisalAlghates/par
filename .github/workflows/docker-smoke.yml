name: Container smoke test

# Builds the demo image, starts it, signs in with the app's test-login route and requests the main pages.
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'docker/**', 'ParHub/**', '.github/workflows/docker-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t parhub-demo .
      - name: Run and request the pages
        run: |
          docker run -d --name app -p 8080:10000 -e APP_DEBUG=true parhub-demo
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          curl -s -c jar -b jar -L -o /dev/null http://127.0.0.1:8080/test-login
          fail=0
          for p in / /dashboard /dashboard/advanced /dashboard/analytics /presentations /presentations/create /templates /categories /analytics /search /media /shared /ai-assistant /help /billing /settings/profile /settings/appearance; do
            code=$(curl -s -b jar -o body.txt -w '%{http_code}' -H 'Accept: application/json' "http://127.0.0.1:8080$p")
            echo "$code $p"
            if [ "$code" != "200" ] && [ "$code" != "302" ]; then fail=1; head -c 400 body.txt | tr '\n' ' '; echo; fi
          done
          docker logs app 2>&1 | tail -n 20
          exit $fail
