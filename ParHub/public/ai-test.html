<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="test-token">
    <title>AI Presentation Creator - Test</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
    <div x-data="aiTestData()" class="max-w-4xl w-full">
        <!-- Test Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-4 animate-float">
                🤖 AI Presentation Creator Test
            </h1>
            <p class="text-white/80 text-lg">
                Test the AI presentation generation functionality
            </p>
        </div>
        
        <!-- Test Interface -->
        <div class="glass-effect rounded-3xl p-8 shadow-2xl">
            <div class="grid lg:grid-cols-2 gap-8">
                
                <!-- Input Section -->
                <div>
                    <h3 class="text-xl font-bold text-white mb-4">📝 Test Input</h3>
                    <textarea x-model="testMessage" 
                              placeholder="Enter your presentation request..."
                              class="w-full h-32 bg-white/10 border border-white/20 rounded-xl p-4 text-white placeholder-white/60 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    
                    <!-- Quick Test Buttons -->
                    <div class="mt-4 space-y-2">
                        <button @click="testMessage = 'Create a business presentation about AI in healthcare for investors'" 
                                class="w-full bg-blue-500/20 hover:bg-blue-500/30 text-white p-3 rounded-xl transition-colors text-left">
                            🏥 AI in Healthcare Business Pitch
                        </button>
                        <button @click="testMessage = 'Generate an educational presentation about renewable energy with 8 slides'" 
                                class="w-full bg-green-500/20 hover:bg-green-500/30 text-white p-3 rounded-xl transition-colors text-left">
                            🌱 Renewable Energy Education
                        </button>
                        <button @click="testMessage = 'Make a marketing presentation for social media strategy'" 
                                class="w-full bg-purple-500/20 hover:bg-purple-500/30 text-white p-3 rounded-xl transition-colors text-left">
                            📱 Social Media Marketing
                        </button>
                    </div>
                    
                    <button @click="generatePresentation()" 
                            :disabled="!testMessage.trim() || isProcessing"
                            :class="isProcessing ? 'opacity-50 cursor-not-allowed' : 'hover:scale-105'"
                            class="w-full mt-4 bg-gradient-to-r from-orange-500 to-red-600 text-white p-4 rounded-xl font-bold transition-all transform">
                        <span x-show="!isProcessing">🚀 Generate AI Presentation</span>
                        <span x-show="isProcessing">⏳ Creating Presentation...</span>
                    </button>
                </div>
                
                <!-- Output Section -->
                <div>
                    <h3 class="text-xl font-bold text-white mb-4">📊 Generated Output</h3>
                    <div class="bg-white/10 rounded-xl p-4 h-80 overflow-y-auto">
                        <div x-show="!result && !isProcessing" class="text-white/60 text-center py-8">
                            Generated presentation details will appear here...
                        </div>
                        
                        <div x-show="isProcessing" class="text-center py-8">
                            <div class="animate-spin w-8 h-8 border-4 border-white/30 border-t-white rounded-full mx-auto mb-4"></div>
                            <p class="text-white/80">AI is generating your presentation...</p>
                        </div>
                        
                        <div x-show="result" class="space-y-4">
                            <div class="bg-emerald-500/20 border border-emerald-400/30 rounded-lg p-4">
                                <h4 class="font-bold text-emerald-300 mb-2" x-text="result?.title"></h4>
                                <div class="text-white/80 text-sm space-y-1">
                                    <p><strong>Type:</strong> <span x-text="result?.type"></span></p>
                                    <p><strong>Theme:</strong> <span x-text="result?.theme"></span></p>
                                    <p><strong>Slides:</strong> <span x-text="result?.slideCount"></span></p>
                                    <p><strong>Duration:</strong> <span x-text="result?.estimatedDuration"></span> minutes</p>
                                </div>
                            </div>
                            
                            <div class="space-y-2">
                                <h5 class="font-bold text-white">Slide Structure:</h5>
                                <template x-for="(slide, index) in result?.slides" :key="index">
                                    <div class="bg-white/10 rounded-lg p-3 flex justify-between items-center">
                                        <div>
                                            <span class="text-blue-300 font-medium" x-text="`${index + 1}. ${slide.title}`"></span>
                                            <div class="text-white/60 text-xs" x-text="slide.content"></div>
                                        </div>
                                        <span class="text-xs bg-blue-500/30 px-2 py-1 rounded" x-text="slide.type"></span>
                                    </div>
                                </template>
                            </div>
                            
                            <!-- Test Actions -->
                            <div class="flex space-x-2 mt-4">
                                <button @click="testBackendCall()" 
                                        class="flex-1 bg-blue-500/20 hover:bg-blue-500/30 text-white p-2 rounded-lg text-sm transition-colors">
                                    📤 Test Backend
                                </button>
                                <button @click="downloadJSON()" 
                                        class="flex-1 bg-green-500/20 hover:bg-green-500/30 text-white p-2 rounded-lg text-sm transition-colors">
                                    💾 Download JSON
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Status Messages -->
            <div x-show="statusMessage" 
                 :class="statusType === 'success' ? 'bg-emerald-500/20 border-emerald-400' : 'bg-red-500/20 border-red-400'"
                 class="mt-6 p-4 rounded-xl border text-white">
                <p x-text="statusMessage"></p>
            </div>
        </div>
    </div>

    <script>
        function aiTestData() {
            return {
                testMessage: '',
                result: null,
                isProcessing: false,
                statusMessage: '',
                statusType: 'info',
                
                generatePresentation() {
                    if (!this.testMessage.trim()) return;
                    
                    this.isProcessing = true;
                    this.result = null;
                    this.statusMessage = '';
                    
                    // Simulate AI processing
                    setTimeout(() => {
                        this.result = this.mockGeneratePresentation(this.testMessage);
                        this.isProcessing = false;
                        this.statusMessage = '✅ Presentation generated successfully!';
                        this.statusType = 'success';
                    }, 2000);
                },
                
                mockGeneratePresentation(message) {
                    const lowerMessage = message.toLowerCase();
                    let presentationType = 'general';
                    let slides = [];
                    let theme = 'professional';
                    
                    // Determine presentation type
                    if (lowerMessage.includes('business') || lowerMessage.includes('pitch')) {
                        presentationType = 'business';
                        theme = 'corporate';
                        slides = [
                            { title: "Executive Summary", content: "High-level overview", type: "title" },
                            { title: "Problem Statement", content: "What problem are we solving?", type: "content" },
                            { title: "Solution Overview", content: "Our innovative solution", type: "content" },
                            { title: "Market Analysis", content: "Target market and opportunities", type: "data" },
                            { title: "Business Model", content: "How we make money", type: "diagram" },
                            { title: "Financial Projections", content: "Revenue and profitability", type: "chart" },
                            { title: "Call to Action", content: "Next steps", type: "conclusion" }
                        ];
                    } else if (lowerMessage.includes('education') || lowerMessage.includes('academic')) {
                        presentationType = 'educational';
                        theme = 'academic';
                        slides = [
                            { title: "Learning Objectives", content: "What students will learn", type: "title" },
                            { title: "Introduction", content: "Topic overview", type: "content" },
                            { title: "Key Concepts", content: "Fundamental principles", type: "concept" },
                            { title: "Real-World Examples", content: "Practical applications", type: "example" },
                            { title: "Case Study", content: "Detailed analysis", type: "case" },
                            { title: "Summary", content: "Key takeaways", type: "summary" }
                        ];
                    } else if (lowerMessage.includes('marketing')) {
                        presentationType = 'marketing';
                        theme = 'creative';
                        slides = [
                            { title: "Brand Story", content: "Mission and vision", type: "title" },
                            { title: "Market Research", content: "Industry insights", type: "data" },
                            { title: "Target Audience", content: "Customer personas", type: "personas" },
                            { title: "Campaign Strategy", content: "Marketing approach", type: "strategy" },
                            { title: "Budget & ROI", content: "Investment and returns", type: "budget" }
                        ];
                    } else {
                        slides = [
                            { title: "Introduction", content: "Topic overview", type: "title" },
                            { title: "Main Points", content: "Key concepts", type: "content" },
                            { title: "Supporting Evidence", content: "Data and examples", type: "data" },
                            { title: "Conclusion", content: "Summary", type: "conclusion" }
                        ];
                    }
                    
                    return {
                        title: this.extractTitle(message),
                        type: presentationType,
                        theme: theme,
                        slides: slides,
                        slideCount: slides.length,
                        estimatedDuration: Math.ceil(slides.length * 2),
                        created: new Date().toISOString()
                    };
                },
                
                extractTitle(message) {
                    const lowerMessage = message.toLowerCase();
                    if (lowerMessage.includes('business')) return 'Business Presentation';
                    if (lowerMessage.includes('marketing')) return 'Marketing Strategy';
                    if (lowerMessage.includes('education')) return 'Educational Content';
                    if (lowerMessage.includes('healthcare')) return 'Healthcare Innovation';
                    if (lowerMessage.includes('energy')) return 'Renewable Energy Overview';
                    return 'Custom Presentation';
                },
                
                testBackendCall() {
                    if (!this.result) return;
                    
                    this.statusMessage = '📡 Testing backend connection...';
                    this.statusType = 'info';
                    
                    // Simulate backend call
                    fetch('/presentations/create-from-ai', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                        },
                        body: JSON.stringify(this.result)
                    })
                    .then(response => response.json())
                    .then(data => {
                        this.statusMessage = '✅ Backend connection successful!';
                        this.statusType = 'success';
                        console.log('Backend response:', data);
                    })
                    .catch(error => {
                        this.statusMessage = '❌ Backend connection failed: ' + error.message;
                        this.statusType = 'error';
                        console.error('Backend error:', error);
                    });
                },
                
                downloadJSON() {
                    if (!this.result) return;
                    
                    const dataStr = JSON.stringify(this.result, null, 2);
                    const dataBlob = new Blob([dataStr], {type: 'application/json'});
                    const url = URL.createObjectURL(dataBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `ai-presentation-${Date.now()}.json`;
                    link.click();
                    URL.revokeObjectURL(url);
                    
                    this.statusMessage = '💾 JSON file downloaded successfully!';
                    this.statusType = 'success';
                }
            }
        }
    </script>
</body>
</html>
